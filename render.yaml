services:
  - type: web
    name: song-downloader-backend
    env: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DENO_PATH
        value: /opt/render/project/src/backend/bin/deno
      - key: YTDLP_VERBOSE
        value: "false"
